name: Build and deploy documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: >-
    ${{
      github.workflow
    }}-${{
      github.event_name == 'pull_request'
        && format('pr-{0}', github.event.pull_request.number)
        || github.ref
    }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Regenerate the dependency graph live so the published site always
      # reflects flake.lock + cabal.project HEAD, including current pin
      # staleness vs upstream. Not committed; the committed copy
      # (docs/dependencies.md) is the deterministic one gated in CI.
      - name: Refresh dependency graph
        uses: paolino/dev-assets/dep-graph@main
        with:
          language: haskell
          flake-path: checkout
          owner-regex: "paolino|lambdasistemi|cardano-foundation|pragma-org"
          output: checkout/docs/dependencies.md
          title: "amaru-treasury-tx dependency graph"

      - name: Build docs
        working-directory: checkout
        run: >-
          nix develop github:paolino/dev-assets?dir=mkdocs --quiet
          -c mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: checkout/site

      - name: Build app preview
        if: github.event_name == 'pull_request'
        working-directory: checkout
        run: |
          nix build .#frontend --out-link frontend-result
          mkdir -p site/app
          cp -R frontend-result/. site/app/

      - name: Publish PR preview
        if: github.event_name == 'pull_request'
        uses: paolino/dev-assets/static-preview@main
        with:
          path: checkout/site
          comment-marker: "<!-- docs-preview-url -->"

      - name: Comment app preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          APP_PREVIEW_URL: https://preview.dev.plutimus.com/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/app/
          APP_PREVIEW_COMMENT_MARKER: "<!-- app-preview-url -->"
        with:
          script: |
            const url = process.env.APP_PREVIEW_URL;
            const marker = process.env.APP_PREVIEW_COMMENT_MARKER;
            const issue_number = Number(context.issue.number);

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed(`Invalid pull request number: ${context.issue.number}`);
              return;
            }

            const body = [
              marker,
              `Dashboard app preview: ${url}`,
              "",
              "The app preview has no `/v1` backend yet (Layer 2 follow-up), so API-dependent features will not work. Browser-local and pending features are available.",
            ].join("\n");
            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });
            const existing = comments.find(
              comment => comment.body && comment.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: nixos
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  pr-preview-cleanup:
    name: Remove PR Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: nixos
    steps:
      - uses: paolino/dev-assets/static-preview@main
        with:
          mode: cleanup
