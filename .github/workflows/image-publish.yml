name: Image publish + deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: nixos
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/lambdasistemi/amaru-treasury-tx-api
    steps:
      - uses: actions/checkout@v6

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build container image (nix)
        run: nix build --quiet .#image --out-link image-stream

      - name: Load, tag, login and push (docker provided via nix)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell nixpkgs#docker -c bash -euo pipefail -c '
            ./image-stream | docker load
            docker tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}"
            echo "$GITHUB_TOKEN" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker push "$IMAGE:latest"
            docker push "$IMAGE:${{ github.sha }}"
          '

  deploy:
    needs: publish
    permissions:
      contents: read
      packages: read
    # Runs on the self-hosted runner that lives on the production
    # host itself.  The previous job ran on ubuntu-latest and reached
    # back in over public SSH, which meant every deploy depended on
    # inbound :22 from GitHub's runners.  That dependency broke on
    # 2026-08-19 and silently stopped shipping merged code for ten
    # days (#504).  Deploying from the host removes the hop entirely.
    runs-on: nixos
    env:
      EXPECTED_SHA: ${{ github.sha }}
      PUBLIC_BASE_URL: https://amaru-treasury.plutimus.com
      # Absolute: the runner's HOME is /srv/ci-work/runner-N/work,
      # not the operator's, so "~/services/..." would not resolve.
      COMPOSE_DIR: /srv/prod-hot/services/amaru-treasury
    steps:
      - name: Log in to ghcr so compose can pull the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH=/run/current-system/sw/bin:"$PATH"
          echo "$GITHUB_TOKEN" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update amaru-treasury on this host
        run: |
          set -euo pipefail
          # The runner service does not inherit the system profile
          # on PATH, which is why the publish job wraps docker in
          # "nix shell".  docker and curl both live here on NixOS.
          export PATH=/run/current-system/sw/bin:"$PATH"
          cd "$COMPOSE_DIR"
          docker compose pull
          docker compose up -d

          version_body="$(mktemp)"
          cleanup() {
            rm -f "$version_body"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 \
              "$PUBLIC_BASE_URL/v1/version" \
              >"$version_body"; then
              version_json="$(tr -d '\n' < "$version_body")"
              git_commit="$(
                printf '%s\n' "$version_json" \
                  | sed -n 's/.*"biGitCommit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
              )"

              if [ -z "$git_commit" ]; then
                echo "deploy smoke: /v1/version missing biGitCommit" >&2
                cat "$version_body" >&2
                exit 1
              fi

              case "$EXPECTED_SHA" in
                "$git_commit"*)
                  ;;
                *)
                  echo "deploy smoke: expected deployed commit prefix $EXPECTED_SHA, got $git_commit" >&2
                  cat "$version_body" >&2
                  exit 1
                  ;;
              esac

              grep -q '"biMetadataSha256"' "$version_body" \
                || { echo "deploy smoke: /v1/version missing biMetadataSha256" >&2; cat "$version_body" >&2; exit 1; }
              grep -q '"biRecentTxsCount"' "$version_body" \
                || { echo "deploy smoke: /v1/version missing biRecentTxsCount" >&2; cat "$version_body" >&2; exit 1; }

              echo "deploy smoke: /v1/version OK for $git_commit"
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "deploy smoke: /v1/version did not become ready" >&2
              docker compose ps >&2
              docker compose logs --tail=200 amaru-treasury >&2
              exit 1
            fi

            sleep 2
          done

          docker image prune -f
